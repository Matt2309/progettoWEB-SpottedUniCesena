<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crea Spotted</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body{
      background:white;
    }

    .top-bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:10px 15px;
      border-bottom:1px solid #ddd;
    }

    .title{
      color:#a51e1e;
      font-weight:600;
      margin:0;
    }

    .btn-post{
      background:#a51e1e;
      color:white;
      border-radius:12px;
      border:none;
      padding:5px 15px;
    }

    .user-box{
      margin-top:15px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:0 10px;
    }

    .avatar{
      width:35px;
      height:35px;
      border-radius:50%;
      background:#6cd0ff;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      font-weight:700;
    }

    textarea{
      width:100%;
      border:none;
      outline:none;
      margin-top:10px;
      font-size:18px;
    }

  </style>
</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
    <a href="index.html" class="text-dark fs-4 text-decoration-none">&times;</a>
    <h5 class="title">Crea spotted</h5>
    <button class="btn-post">Post</button>
</div>

<div class="container mt-3">

    <!-- USER INFO -->
    <div class="user-box">
        <div class="d-flex align-items-center">
            <div class="avatar">P</div>
            <div class="ms-2">
                <strong>pippo_franco</strong>
            </div>
        </div>

        <select class="form-select form-select-sm" style="width:120px;">
            <option selected>categoria</option>
            <option value="1">Persone</option>
            <option value="2">Avvisi</option>
            <option value="3">Altro</option>
        </select>
    </div>

    <!-- TEXT AREA -->
    <textarea rows="6" placeholder="Chi o che cosa vuoi spottare?"></textarea>

</div>

</body>
</html>
