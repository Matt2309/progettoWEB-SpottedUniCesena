<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrazione</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

   <link rel="stylesheet" href="theme.css">
</head>

<body class="bg-white">

  <div class="container min-vh-100 d-flex justify-content-center align-items-start">
    <div class="w-100" style="max-width:420px;">

      <!-- Titolo App -->
      <h2 class="text-primary text-center fw-semibold mt-4">
        SpottedUniCesena
      </h2>

      <!-- Titolo Pagina -->
      <h4 class="text-primary text-center fw-bold mt-4 mb-4">
        Registrati
      </h4>

      <!-- FORM -->
      <form action="/api/auth/register.php" method="POST">

        <input type="text"
               name="nome"
               class="form-control rounded-pill border-primary mb-3"
               placeholder="Nome *"
               required>

        <input type="text"
               name="cognome"
               class="form-control rounded-pill border-primary mb-3"
               placeholder="Cognome *"
               required>

        <input type="text"
                name="username"
                class="form-control rounded-pill border-danger mb-3"
                placeholder="Username *"
                required>

        <input type="email"
               name="email"
               class="form-control rounded-pill border-primary mb-3"
               placeholder="Email *"
               required>

        <input type="password"
               name="password"
               class="form-control rounded-pill border-primary mb-3"
               placeholder="Password *"
               required>

        <input type="password"
               name="confirm_password"
               class="form-control rounded-pill border-primary mb-4"
               placeholder="Conferma password *"
               required>

        <div class="text-center">
          <button type="submit" class="btn btn-primary rounded-pill px-5 fw-semibold">
            <i class="bi bi-person-plus me-1"></i>
            Registrati
          </button>
        </div>

      </form>

      <!-- Link Login -->
      <p class="text-center text-primary mt-4">
        Hai già un account?
        <a href="Login.html" class="text-primary fw-semibold">
          Accedi
        </a>
      </p>

    </div>
  </div>

</body>
</html>
