<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrazione</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body{
      background:#ffffff;
    }

    .app-title{
      color:#a51e1e;
      font-weight:500;
    }

    .register-box{
      max-width:420px;
      margin:auto;
      margin-top:30px;
      text-align:center;
    }

    .register-title{
      color:#a51e1e;
      font-weight:600;
      margin-top:30px;
      margin-bottom:20px;
    }

    .rounded-input{
      border-radius:25px;
      border:2px solid #a51e1e;
      padding:12px;
    }

    .btn-register{
      background:#a51e1e;
      color:white;
      border-radius:25px;
      font-size:18px;
      padding:10px 0;
      border:none;
    }

    .btn-register:hover{
      background:#8c1818;
    }

    .login-text{
      margin-top:20px;
      color:#a51e1e;
    }

    .login-text a{
      color:#a51e1e;
      text-decoration:underline;
    }

  </style>
</head>

<body>

  <div class="register-box">

      <!-- Titolo App -->
      <h2 class="app-title">SpottedUniCesena</h2>

      <!-- Titolo Pagina -->
      <h4 class="register-title">Registrati</h4>

      <!-- FORM -->
      <form action="register.php" method="POST">

          <input type="text" class="form-control rounded-input mb-3"
                 placeholder="Nome *" name="nome" required>

          <input type="text" class="form-control rounded-input mb-3"
                 placeholder="Cognome *" name="cognome" required>

          <input type="email" class="form-control rounded-input mb-3"
                 placeholder="Email *" name="email" required>

          <input type="password" class="form-control rounded-input mb-3"
                 placeholder="Password *" name="password" required>

          <input type="password" class="form-control rounded-input mb-4"
                 placeholder="Conferma password *" name="confirm_password" required>

          <button type="submit" class="btn btn-register w-50">
              Registrati
          </button>
      </form>

      <!-- Link Login -->
      <p class="login-text">
          Hai già un account?
          <a href="Login.html">Accedi.</a>
      </p>

  </div>

</body>
</html>
