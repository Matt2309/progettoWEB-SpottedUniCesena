<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
</head>

<body class="bg-white">

  <main class="container min-vh-100 d-flex justify-content-center align-items-start">
    <div class="w-100" style="max-width:420px;">

      <!-- Titolo App -->
      <h1 class="text-primary text-center fw-semibold mt-4">
        SpottedUniCesena
      </h1>

      <!-- Titolo Pagina -->
      <h2 class="text-primary text-center fw-bold mt-4 mb-4">
        Login
      </h2>

      <!-- FORM -->
      <form onsubmit="validateAndSubmitLogin(event);">
        <label for="username" class="visually-hidden">
          Nome utente o email
        </label>
        <input type="text"
               name="username"
               id="username"
               class="form-control rounded-pill border-primary"
               placeholder="Nome utente o email*"
               required />
          <p class="error mb-3 text-danger" id="userError"></p>

          <label for="password" class="visually-hidden">
            Password
          </label>
          <input type="password"
               name="password"
                 id="password"
                 class="form-control rounded-pill border-primary"
               placeholder="Password *"
               required />
          <p class="error mb-4 text-danger" id="passwordError"></p>

          <div class="text-center">
          <button type="submit" class="btn btn-primary rounded-pill px-5 fw-semibold">
            <span class="bi bi-box-arrow-in-right me-1" aria-hidden="true"></span>
            Accedi
          </button>
              <small class="error" id="formError"></small>
          </div>
      </form>

      <!-- Link registrazione -->
      <p class="text-center text-primary mt-4">
        Non hai un account?
        <a href="Registrazione.html" class="text-primary fw-semibold">
          Registrati
        </a>
      </p>

    </div>
  </main>
  <script src="js/auth/auth.js"></script>
</body>
</html>
