<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
</head>

<body class="bg-white">

  <div class="container min-vh-100 d-flex justify-content-center align-items-start">
    <div class="w-100" style="max-width:420px;">

      <!-- Titolo App -->
      <h2 class="text-danger text-center fw-semibold mt-4">
        SpottedUniCesena
      </h2>

      <!-- Titolo Pagina -->
      <h4 class="text-danger text-center fw-bold mt-4 mb-4">
        Login
      </h4>

      <!-- FORM -->
      <form action="login.php" method="POST">

        <input type="text"
               name="username"
               class="form-control rounded-pill border-danger mb-3"
               placeholder="Nome utente *"
               required>

        <input type="password"
               name="password"
               class="form-control rounded-pill border-danger mb-4"
               placeholder="Password *"
               required>

        <div class="text-center">
          <button type="submit" class="btn btn-primary rounded-pill px-5 fw-semibold">
            <i class="bi bi-box-arrow-in-right me-1"></i>
            Accedi
          </button>
        </div>

      </form>

      <!-- Link registrazione -->
      <p class="text-center text-danger mt-4">
        Non hai un account?
        <a href="Registrazione.html" class="text-danger fw-semibold">
          Registrati
        </a>
      </p>

    </div>
  </div>

</body>
</html>
