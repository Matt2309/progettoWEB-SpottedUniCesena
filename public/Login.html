<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body{
      background:#ffffff;
    }

    .app-title{
      color:#a51e1e;
      font-weight:500;
    }

    .login-box{
      max-width:420px;
      margin:auto;
      margin-top:30px;
      text-align:center;
    }

    .login-title{
      color:#a51e1e;
      font-weight:600;
      margin-top:30px;
      margin-bottom:20px;
    }

    .rounded-input{
      border-radius:25px;
      border:2px solid #a51e1e;
      padding:12px;
    }

    .btn-login{
      background:#a51e1e;
      color:white;
      border-radius:25px;
      font-size:18px;
      padding:10px 0;
      border:none;
    }

    .btn-login:hover{
      background:#8c1818;
    }

    .register-text{
      margin-top:20px;
      color:#a51e1e;
    }

    .register-text a{
      color:#a51e1e;
      text-decoration:underline;
    }

  </style>
</head>

<body>

  <div class="login-box">

      <h2 class="app-title">SpottedUniCesena</h2>

      <h4 class="login-title">Login</h4>

      <form action="login.php" method="POST">

          <input type="text" class="form-control rounded-input mb-3"
                 placeholder="Nome utente *" name="username" required>

          <input type="password" class="form-control rounded-input mb-4"
                 placeholder="Password *" name="password" required>

          <button type="submit" class="btn btn-login w-50">
              Accedi
          </button>
      </form>

      <p class="register-text">
          Non hai un account?
          <a href="Registrazione.html">Registrati.</a>
      </p>

  </div>

</body>
</html>
